services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: swimming
      POSTGRES_PASSWORD: swimming-local
      POSTGRES_DB: swimming
    ports:
      - '127.0.0.1:55439:5432'
    volumes:
      - swimming-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swimming']
      interval: 5s
      timeout: 5s
      retries: 10
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:11025:1025'
      - '127.0.0.1:18025:8025'
volumes:
  swimming-data:
