<script>
const copy={
 zh:{language:'English',internal:'內部原型・示範資料',choose:'游泳學校營運',hint:'選擇身份，查看日常課堂及營運流程。',roles:{parent:['家長','查看子女課堂、預約、學費及學習進度。'],coach:['教練','處理今日課堂、出席確認及家長申請。'],admin:['管理員','掌握出席提示、付款狀態及營運事項。']},switch:'切換身份',ready:'示範資料',readyHint:'此介面展示原型流程；資料為虛構樣本，不代表真實付款或通知。',tabs:{parent:[['⌂','主頁','林小泳｜本期已上 1/4，餘下已預約 2/3、未預約 1/3；下一堂 11 月 18 日城門谷，教練 ALEX。'],['▦','時間表／預約','11 月 18–30 日時間表；本期尚可預約一堂，選擇日期、時間及地點後確認。'],['$','學費','本期餘下一堂未上時提示續期；下一期少年集體班學費 HK$1,000，繳付完成後可預先預約下一期課堂。'],['○','學員進度','林小泳｜11 月 14 日城門谷課堂評語：學習蛙式時雙腳未有屈膝，建議參考教學庫蛙泳腳視頻。']],coach:[['☀','今日課堂','上午 10:00｜北區泳池｜2 位學員。待確認出席：1 位。課堂開始 15 分鐘後可確認出席。'],['✓','出席','已分配課堂的出席名單。課堂開始 15 分鐘後開放確認；出席紀錄可於課堂後 3 日內編輯。'],['◷','可授課時間','管理自己的可授課時段。開課前 72 小時內不可修改；其他教練的時段不可編輯。'],['↔','申請','待處理：調堂申請 1 宗、補堂申請 1 宗。教練批核後，標準申請即告完成。']],admin:[['▥','營運總覽','列出全導師每日課堂，支援日期、導師及關鍵字篩選。'],['⌖','地區','按學校五區地圖篩選本月課堂，再選定日期。'],['○','學員管理','查看學員資料、泳班進度、會籍及已繳未上堂數。'],['⚙','管理','管理學員及教練紀錄、資料匯入、推廣內容，以及附有原因和操作紀錄的特殊處理。']]}}
};let role=null,tab=0,lang='zh';const root=document.querySelector('#screen');function render(){const c=copy[lang];root.innerHTML=`<header class="header"><div class="brand"><span class="mark">泳</span><span>SwimCoach Pro</span></div><div class="actions">${role?`<button class="button" id="switch">${c.switch}</button>`:''}<button class="button" id="language">${c.language}</button></div></header>`;if(!role){root.innerHTML+=`<section class="content"><p class="eyebrow">${c.internal}</p><h1 class="title">${c.choose}</h1><p class="description">${c.hint}</p><div class="roles">${Object.entries(c.roles).map(([key,[name,desc]])=>`<button class="role" data-role="${key}"><span class="avatar">${name[0]}</span><span><strong>${name}</strong><span>${desc}</span></span><span class="chevron">›</span></button>`).join('')}</div></section>`;root.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;tab=0;render()})}else{const name=c.roles[role][0],item=c.tabs[role][tab];root.innerHTML+=`<section class="content"><p class="eyebrow">${name}</p><h1 class="title">${item[1]}</h1>${role==='coach'?coachContent():role==='parent'?parentContent():role==='admin'?adminContent():`<p class="description">${item[2]}</p>`}<div class="status"><strong>✓ ${c.ready}</strong><p>${c.readyHint}</p></div></section><nav class="tabs">${c.tabs[role].map((t,i)=>`<button class="tab ${i===tab?'active':''}" data-tab="${i}"><span class="symbol">${t[0]}</span><span>${t[1]}</span></button>`).join('')}</nav>`;root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=Number(b.dataset.tab);render()})}root.querySelector('#language').onclick=()=>{lang=lang==='zh'?'en':'zh';if(lang==='en'){copy.en={...copy.zh,language:'繁體中文',internal:'Internal iOS prototype',choose:'Choose how you want to enter',hint:'Use a sample role to review the prototype.',switch:'Switch role',ready:'Prototype area ready',readyHint:'Fictional review data only. Payments, email and app records are not connected.',roles:{parent:['Parent','Manage linked children, classes, payments, and progress.'],coach:['Coach','Run assigned classes, attendance, availability, and requests.'],admin:['Admin','Monitor operations, payments, records, and exceptions.']},tabs:{parent:[['⌂','Home','See the next class, attendance, and progress at a glance.'],['▦','Schedule/Book','Review eligible classes and manage bookings.'],['$','Payment','Review tuition status and mock payment activity.'],['○','Progress','Manage language and student preferences.']],coach:[['☀','Today','See assigned classes and attendance alerts.'],['✓','Attendance','Confirm attendance for assigned classes.'],['◷','Availability','Create and review available time slots.'],['↔','Requests','Review swap and make-up requests.']],admin:[['▥','Dashboard','Monitor classes, attendance, requests, and payments.'],['⌖','Districts','Review pools, coaches, and operating status.'],['○','Students','Review student profiles, membership and paid class balances.'],['⚙','Admin','Manage records, imports, promotions, and exceptions.']]}}}render()};root.querySelector('#switch')?.addEventListener('click',()=>{role=null;render()});wireCoach();wireParent();wireAdmin();wirePaymentReceipts()}

const reviewDay='2026-11-17';
let selectedDay=reviewDay,notice='',modal=null,requestStatus='pending',returnFocus=null;
const lessons=[
 {id:'a',date:reviewDay,start:'11:00',end:'12:00',place:'城門谷',group:'少年',students:['陳大文','李小明','何一田','張心蕊','黃平土']},
 {id:'b',date:reviewDay,start:'12:00',end:'13:00',place:'城門谷',group:'成人',students:['張文傑']},
 {id:'c',date:reviewDay,start:'15:00',end:'16:00',place:'康城領都',group:'成人',students:['林海晴']},
 {id:'d',date:reviewDay,start:'17:00',end:'18:00',place:'海茵莊園',group:'青年',students:['周子朗','梁樂瑤','鄭柏言']}
];
const marks=new Set(['a:陳大文','a:何一田','a:張心蕊']);
const freeSlots=[{start:'13:00',end:'15:00',suggest:1},{start:'18:00',end:'22:00',suggest:2}];
const availability=[];
const L=(zh,en)=>lang==='zh'?zh:en;
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const minutes=t=>Number(t.slice(0,2))*60+Number(t.slice(3));
function dayLessons(){return lessons.filter(x=>x.date===selectedDay)}
function dateBar(){return `<div class="datebar"><button type="button" data-day="-1" aria-label="${L('上一日','Previous day')}">‹</button><label><span class="hidden">${L('選擇日期','Choose date')}</span><input id="coach-date" type="date" value="${selectedDay}" required aria-label="${L('選擇日期','Choose date')}"></label><button type="button" data-day="1" aria-label="${L('下一日','Next day')}">›</button></div>`}
function coachContent(){
 const list=dayLessons();
 let body='';
 if(tab===0){body=`<p class="eyebrow">DAILY EVENT · 07:00–23:00</p><div class="day-grid">${Array.from({length:16},(_,i)=>{const h=i+7;return `<div class="hour"><span class="hour-label">${String(h).padStart(2,'0')}:00</span><div class="hour-body">${list.filter(x=>Math.floor(minutes(x.start)/60)===h).map(x=>`<div class="event" style="top:${minutes(x.start)%60/60*72}px;min-height:${(minutes(x.end)-minutes(x.start))/60*72-4}px"><strong>${x.start}–${x.end} ${esc(x.place)}</strong>${x.students.length} ${L('人','students')} · ${esc(x.group)}<br>${capacityLabel(x)}</div>`).join('')}</div></div>`}).join('')}</div>`}
 if(tab===1){const names=[...new Set(list.flatMap(x=>x.students))];body=list.length?`<p class="review-note">${L('點選方格標記 V＝出席；空白＝未標記；—＝未報讀。','Tap a cell: V = present; blank = unmarked; — = not enrolled.')}</p><div class="table-scroll" tabindex="0" role="region" aria-label="${L('可橫向捲動的出席表','Scrollable attendance grid')}"><table class="attendance"><caption class="hidden">${selectedDay} ${L('出席表','Attendance')}</caption><thead><tr><th scope="col">${L('學員','Student')}</th>${list.map(x=>`<th scope="col">${x.start}–${x.end}<br>${esc(x.place)} (${x.students.length})<br>${capacityLabel(x)}</th>`).join('')}</tr></thead><tbody>${names.map(name=>`<tr><th scope="row">${esc(name)}</th>${list.map(x=>`<td>${x.students.includes(name)?`<button data-mark="${esc(x.id+':'+name)}" aria-label="${esc(name+' '+x.start+' '+x.place)}" aria-pressed="${marks.has(x.id+':'+name)}">${marks.has(x.id+':'+name)?'V':''}</button>`:'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="review-note">${L('此介面稿只示範標記操作，未接駁出席時限或正式紀錄。','Review interaction only; attendance cutoffs and app records are not connected.')}</p>`:empty()}
 if(tab===2){body=selectedDay===reviewDay?freeSlots.map((x,i)=>`<button class="slot-card" data-slot="${i}"><strong>${x.start}–${x.end}</strong><span class="badge">${L('建議','Suggested: ')} ${x.suggest} ${L('課','lessons')}</span><br>${L('點選填寫地點、時間及人數','Enter location, time and class size')} ›</button>`).join(''):empty();const saved=availability.filter(x=>x.date===selectedDay);if(saved.length)body+=`<h2>${L('已填寫時段','Entered time slots')}</h2>${saved.map(x=>`<div class="slot-card"><strong>${x.start}–${x.end} ${esc(x.place)}</strong>${x.count} ${L('人','students')}</div>`).join('')}`;body+=`<p class="review-note">${L('此為時段填寫預覽；建議課數為示例，尚未建立預約或更改 72 小時限制。','Time-slot preview; suggested counts are examples. No booking is created or 72-hour rule changed.')}</p>`}

 if(tab===1){const r=adminRegions.find(x=>x.id===adminRegion);body=`<h2>${L('香港五區','Hong Kong operating regions')}</h2><div id="admin-map">${adminMap()}</div><div class="region-buttons"><button data-region="" aria-pressed="${!adminRegion}">${L('全部地區','All regions')}</button>${adminRegions.map(r=>`<button data-region="${r.id}" aria-pressed="${adminRegion===r.id}">${L(r.zh,r.en)}</button>`).join('')}</div><p class="review-note">${r?`${L(r.zh,r.en)}：${r.places.join('、')}`:L('選擇地圖或地區按鈕，篩選本月課堂。','Select a region on the map or use the buttons to filter this month’s classes.')}</p><h2>${L('2026 年 11 月 · 本月課堂','November 2026 · Monthly classes')}</h2><label for="admin-month-date">${L('再選定日子（留空顯示全月）','Filter date (leave blank for full month)')}</label><input id="admin-month-date" type="date" min="2026-11-01" max="2026-11-30" value="${adminMonthDay}"><button class="button" id="admin-month-clear">${L('清除日期篩選','Clear date filter')}</button><div id="admin-month-results">${adminMonthResults()}</div>`}
 if(tab===2)body=`<p class="description">${L('選擇學員，查看泳班、進度、會籍及已繳未上堂數。','Select a student to review classes, progress, membership and paid class balance.')}</p><label for="admin-student-search">${L('搜尋學員／泳班／進度','Search student, pool or level')}</label><input id="admin-student-search" type="search" value="${esc(adminStudentKeyword)}" placeholder="${L('輸入學員名稱','Enter student name')}"><div id="admin-student-results">${adminStudentResults()}</div><p class="review-note">${L('姓名依指定清單；性別、歲數、會籍及堂數為虛構示範資料。','Names follow the supplied list. Gender, age, membership and balances are fictional samples.')}</p>`;
 if(tab===3)body=`<h2>${L('調堂紀錄','Class swap records')}</h2><p class="description">${L('查看原課堂、申請時段、處理狀態及操作紀錄。','Review original and requested classes, status and history.')}</p><div class="admin-filters"><div><label for="admin-log-status">${L('狀態','Status')}</label><select id="admin-log-status"><option value="">${L('全部狀態','All statuses')}</option>${['pending','approved','rejected'].map(x=>`<option value="${x}" ${adminLogStatus===x?'selected':''}>${adminStatus(x)}</option>`).join('')}</select></div><div><label for="admin-log-search">${L('搜尋紀錄','Search records')}</label><input id="admin-log-search" type="search" value="${esc(adminLogKeyword)}" placeholder="${L('學員、導師、地點…','Student, coach, pool…')}"></div></div><div id="admin-log-results">${adminLogResults()}</div><p class="review-note">${L('調堂紀錄草稿；已確認／未能接納紀錄為虛構例子。標準申請由教練確認，此頁只供查閱，沒有更改正式紀錄。','Draft swap history; approved and rejected examples are fictional. Coaches approve standard requests. This view does not change app records.')}</p>`;
 return `<div class="admin-view">${tab===3?cashReceiptPanel():''}${body}<p class="review-note">${L('示範資料 · 日期以香港時間顯示，重新載入後重設。','Sample data · Hong Kong dates; changes reset on reload.')}</p></div>`;
}
function wireAdmin(){if(role!=='admin')return;
 const date=root.querySelector('#admin-date');if(date)date.onchange=()=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(date.value))return;adminDay=date.value;expandedAdminHours.clear();render()};
 root.querySelectorAll('[data-admin-day]').forEach(b=>b.onclick=()=>{const date=new Date(adminDay+'T12:00:00Z');date.setUTCDate(date.getUTCDate()+Number(b.dataset.adminDay));adminDay=date.toISOString().slice(0,10);expandedAdminHours.clear();render()});
 root.querySelector('#admin-coach')?.addEventListener('change',e=>{adminCoach=e.target.value;render()});
 root.querySelector('#admin-keyword')?.addEventListener('input',e=>{adminKeyword=e.target.value;root.querySelector('#admin-daily-results').innerHTML=adminDailyResults();wireAdminExpansion()});wireAdminExpansion();
 root.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{adminRegion=b.dataset.region;render()});
 root.querySelectorAll('[data-map-region]').forEach(g=>{const select=()=>{adminRegion=g.dataset.mapRegion;render();root.querySelector(`[data-map-region="${adminRegion}"]`)?.focus()};g.onclick=select;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}}});
 root.querySelector('#admin-month-date')?.addEventListener('change',e=>{const value=e.target.value;if(value&&!/^2026-11-\d{2}$/.test(value)){e.target.setCustomValidity(L('請選擇 2026 年 11 月的日期。','Select a date in November 2026.'));e.target.reportValidity();return}e.target.setCustomValidity('');adminMonthDay=value;root.querySelector('#admin-month-results').innerHTML=adminMonthResults()});
 root.querySelector('#admin-month-clear')?.addEventListener('click',()=>{adminMonthDay='';render()});
 root.querySelector('#admin-student-search')?.addEventListener('input',e=>{adminStudentKeyword=e.target.value;root.querySelector('#admin-student-results').innerHTML=adminStudentResults();wireAdminRecords()});
 root.querySelector('#admin-log-status')?.addEventListener('change',e=>{adminLogStatus=e.target.value;root.querySelector('#admin-log-results').innerHTML=adminLogResults();wireAdminRecords()});
 root.querySelector('#admin-log-search')?.addEventListener('input',e=>{adminLogKeyword=e.target.value;root.querySelector('#admin-log-results').innerHTML=adminLogResults();wireAdminRecords()});wireAdminRecords();
}
function wireAdminExpansion(){root.querySelectorAll('[data-admin-expand]').forEach(b=>b.onclick=()=>{const hour=b.dataset.adminExpand,key=adminDay+':'+hour;expandedAdminHours.has(key)?expandedAdminHours.delete(key):expandedAdminHours.add(key);root.querySelector('#admin-daily-results').innerHTML=adminDailyResults();wireAdminExpansion();root.querySelector(`[data-admin-expand="${hour}"]`)?.focus()})}
function wireAdminRecords(){root.querySelectorAll('[data-student]').forEach(b=>b.onclick=()=>showAdminDetail('student',b.dataset.student,b));root.querySelectorAll('[data-swap-record]').forEach(b=>b.onclick=()=>showAdminDetail('swap',b.dataset.swapRecord,b))}
function showAdminDetail(type,id,trigger){if(role!=='admin')return;document.querySelector('.modal-layer')?.remove();const layer=document.createElement('div');layer.className='modal-layer';let body='';
 if(type==='student'){const s=adminStudents.find(x=>x.id===id);if(!s)return;const expiry=s.expiry.split('-').reverse().join('/');body=`<h2 id="admin-detail-title">${L('學員資料','Student profile')} · ${s.name}</h2><dl class="details-grid"><dt>${L('學員名稱','Name')}</dt><dd>${s.name}</dd><dt>${L('性別','Gender')}</dt><dd>${L(s.gender,s.gender==='男'?'Male':'Female')}</dd><dt>${L('歲數','Age')}</dt><dd>${s.age}</dd><dt>${L('學習泳班','Pool / class')}</dt><dd>${s.pool}</dd><dt>${L('學習進度','Level')}</dt><dd>${s.level}</dd><dt>${L('會籍有效至','Membership until')}</dt><dd>${expiry}</dd><dt>${L('已繳未上','Paid, unused')}</dt><dd>${studentBalance(s)} ${L('堂','classes')}</dd></dl><p class="review-note">${L('虛構示範資料，只供管理員介面審閱。','Fictional sample data for administrator review.')}</p>`}
 else{const r=adminSwapRecords().find(x=>x.id===id);if(!r)return;body=`<h2 id="admin-detail-title">${L('調堂紀錄','Swap record')} · ${r.student}</h2><span class="record-status ${r.status}">${adminStatus(r.status)}</span><dl class="details-grid"><dt>${L('紀錄編號','Record ID')}</dt><dd>${r.id}</dd><dt>${L('導師','Coach')}</dt><dd>${r.coach}</dd><dt>${L('提交時間','Submitted')}</dt><dd>${r.submitted} (HK)</dd><dt>${L('原課堂','Original')}</dt><dd>${esc(parentSlotText(r.source))}</dd><dt>${L('申請改至','Requested')}</dt><dd>${esc(parentSlotText(r.target))}</dd><dt>${L('原因／備註','Reason / note')}</dt><dd>${esc(r.reason)}</dd></dl><h3>${L('操作紀錄','History')}</h3><ol class="record-history">${r.history.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`}
 layer.innerHTML=`<section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="admin-detail-title">${body}<button class="secondary" data-admin-close>${L('關閉','Close')}</button></section>`;document.body.append(layer);const button=layer.querySelector('[data-admin-close]'),close=()=>{layer.remove();trigger?.focus()};button.onclick=close;button.focus();layer.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();close()}if(e.key==='Tab'){e.preventDefault();button.focus()}};
}


function cashReceiptPanel(){if(!['coach','admin'].includes(role)||tuitionPayment.method!=='cash')return '';const paid=tuitionPayment.status==='paid';return `<article class="tuition-card"><h2>${L('現金學費簽收','Cash tuition receipt')}</h2><p><strong>林小泳 · ${L('下一期少年集體班','Next youth group term')}</strong></p>${role==='admin'?'<p>HK$1,000</p>':''}<p class="badge">${paid?L('已簽收','Receipt confirmed'):L('待簽收','Awaiting receipt')}</p>${paid?`<p>${L('簽收人：','Received by: ')}${tuitionPayment.receivedBy==='coach'?L('教練 ALEX','Coach ALEX'):L('管理員','Admin')}</p>`:`<p>${L('請確定已實際收取家長交付的現金，才確認簽收。','Confirm receipt only after collecting cash from the parent.')}</p><button class="primary" data-cash-receipt>${L('確認現金簽收','Confirm cash receipt')}</button>`}<p class="review-note">${L('本頁為虛構簽收示範，重新載入後重設。','Fictional receipt demo; resets on reload.')}</p></article>`}
function wirePaymentReceipts(){root.querySelector('[data-cash-receipt]')?.addEventListener('click',e=>showCashReceipt(e.currentTarget))}
function recordCashReceipt(){if(!['coach','admin'].includes(role)||tuitionPayment.method!=='cash'||tuitionPayment.status!=='pending_cash'||nextTermPaid)return false;tuitionPayment.status='paid';tuitionPayment.receivedBy=role;tuitionReceiptHistory.push({actor:role,action:'cash_received',student:'林小泳',term:'next',timestamp:new Date().toISOString()});nextTermPaid=true;return true}
function showCashReceipt(trigger){if(!['coach','admin'].includes(role)||tuitionPayment.status!=='pending_cash')return;const layer=document.createElement('div');layer.className='modal-layer';layer.innerHTML=`<section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="cash-receipt-title"><h2 id="cash-receipt-title">${L('確認現金簽收','Confirm cash receipt')}</h2><p>林小泳 · ${L('下一期少年集體班','Next youth group term')}</p>${role==='admin'?'<p>HK$1,000</p>':''}<p>${L('確認已收到現金？簽收後，家長可預約下一期課堂。','Confirm cash has been received? This unlocks next-term bookings for the parent.')}</p><p class="review-note">${L('示範操作，沒有真實收款。','Demo interaction; no real payment received.')}</p><div class="form-actions"><button class="primary" id="confirm-cash-receipt">${L('已收到現金，確認簽收','Cash received — confirm')}</button><button class="secondary" id="cancel-cash-receipt">${L('取消','Cancel')}</button></div></section>`;document.body.append(layer);const close=()=>{layer.remove();trigger?.focus()};layer.querySelector('#cancel-cash-receipt').onclick=close;layer.querySelector('#confirm-cash-receipt').onclick=()=>{recordCashReceipt();close();render()};const buttons=[...layer.querySelectorAll('button')];buttons[1].focus();layer.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();close()}if(e.key==='Tab'){if((e.shiftKey&&document.activeElement===buttons[0])||(!e.shiftKey&&document.activeElement===buttons[1])){e.preventDefault();buttons[e.shiftKey?1:0].focus()}}};}


const CLASS_CAPACITY=6;
function classOccupancy(x){
 if(x.students)return x.students.length;
 if(Number.isFinite(x.count))return x.count;
 // Parent candidate slots have no other enrolled students in the supplied sample.
 const source=[...lessons,...adminExtraClasses].find(y=>y.date===x.date&&y.start===x.start&&y.end===x.end&&y.place===x.place&&(!y.coach||y.coach==='ALEX'));
 const existing=source?(source.students?source.students.length:source.count):Number(x.otherStudents||0);
 return existing+parentBookings.filter(b=>b.slot===x.id).length;
}
function classSeatsLeft(x){return Math.max(0,CLASS_CAPACITY-classOccupancy(x))}
function capacityLabel(x){const left=classSeatsLeft(x);return L('剩餘名額 '+left+'／'+CLASS_CAPACITY+' 人'+(left===0?' · 已額滿':''),left+' of '+CLASS_CAPACITY+' places remaining'+(left===0?' · Full':''))}

render();
</script>
</body>
</html>
