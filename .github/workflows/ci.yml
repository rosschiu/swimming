name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: swimming
          POSTGRES_PASSWORD: swimming-test
          POSTGRES_DB: swimming
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U swimming"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mail:
        image: axllent/mailpit:v1.27
        ports: ['11025:1025', '18025:8025']
    env:
      SMTP_ADDR: 127.0.0.1:11025
      SMTP_FROM: school@swim.test
      SMTP_TLS: none
      DATABASE_URL: postgres://swimming:swimming-test@localhost:5432/swimming?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/web
      - run: npm run contracts:check
      - name: Test VM delivery control flow
        run: python3 ops/vm/test_delivery.py
      - name: Go formatting, static checks and tests
        working-directory: services/api
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      - name: Verify representative current-feature scale
        working-directory: services/api
        env:
          SCALE_VERIFY_SYNTHETIC: 'true'
        run: go test -race ./internal/app -run '^TestScaleVerification$' -count=1 -v
      - run: npm test --prefix apps/web -- --run
      - run: npm run build --prefix apps/web
      - run: npx playwright install --with-deps chromium
      - name: Seed synthetic E2E records
        working-directory: services/api
        run: |
          go run ./cmd/migrate
          ALLOW_DEMO_SEED=true go run ./cmd/seed
      - run: npm run test:e2e
      - name: Verify synthetic backup and restore
        working-directory: services/api
        env:
          RESTORE_VERIFY_SYNTHETIC: 'true'
          RESTORE_VERIFY_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: go test -race ./internal/app -run '^TestRestore' -count=1 -v
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
      - name: Package VM release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SWIMMING_VM_DELIVERY == 'enabled'
        run: ops/vm/package.sh "$GITHUB_SHA" swimming-release.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SWIMMING_VM_DELIVERY == 'enabled'
        with:
          name: swimming-vm-release
          path: swimming-release.tar.gz
          if-no-files-found: error
          retention-days: 7

  deliver-vm:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SWIMMING_VM_DELIVERY == 'enabled'
    needs: test
    runs-on:
      group: swimming-private-vm
      labels: [self-hosted, linux, x64, swimming-private-vm]
    environment: private-vm
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: swimming-vm-release
      - name: Install tested release
        env:
          GH_TOKEN: ${{ github.token }}
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
          VM_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if ! main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'); then
            echo 'Could not read the current main revision.' >&2
            exit 1
          fi
          if [[ ! "$main_sha" =~ ^[0-9a-f]{40}$ || ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'GitHub returned an invalid release revision.' >&2
            exit 1
          fi
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo 'A newer revision is on main. Skipping this release.'
            exit 0
          fi
          : "${VM_HOST:?Set VM_HOST}" "${VM_USER:?Set VM_USER}" "${VM_KEY:?Set VM_SSH_KEY}" "${VM_KNOWN_HOSTS:?Set VM_KNOWN_HOSTS}"
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          umask 077
          printf '%s\n' "$VM_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VM_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh -T -i "$ssh_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15 -- "$VM_USER@$VM_HOST" \
            "sudo -n /usr/local/sbin/swimming-install-release $GITHUB_SHA" < swimming-release.tar.gz
